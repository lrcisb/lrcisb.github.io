<style>
    :root {
      --innovation-blue: #245bff;
      --legacy-blue:     #192890;
      --future-green:    #80edd9;
      --state-gray:      #2e3b42;
      --mattle-gray:     #5d6f7a;
      --silver-gray:     #95a9b4;
      --light-gray:      #e6ebee;
      --ivory:           #f4f8fa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ivory);
      color: var(--state-gray);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER — compact ~44px ── */
    header {
      background: var(--legacy-blue);
      height: 44px;
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 6px rgba(25,40,144,0.28);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .site-title {
      color: #fff;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .isb-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    /* ── TAB NAVIGATION ── */
    .tab-container {
      background: #fff;

      padding: 0 clamp(1rem, 3vw, 2.5rem);
      overflow-x: auto;

    }

    .tab-list {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: min-content;
    }

    .tab-list li {
      display: inline-block;
    }

    .tab-button {
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      color: var(--mattle-gray);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-family: 'Source Sans 3', sans-serif;
    }

    .tab-button:hover {
      color: var(--innovation-blue);
    }

    .tab-button.active {
      color: var(--innovation-blue);
      border-bottom-color: var(--innovation-blue);
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      padding: clamp(1.5rem, 4vw, 3rem);
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      margin-bottom: 2.5rem;
      border-bottom: 2px solid var(--light-gray);
      padding-bottom: 1.5rem;
    }

    .page-title {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--legacy-blue);
      margin-bottom: 0.5rem;
    }

    .page-subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: var(--mattle-gray);
      font-weight: 400;
    }

    /* ── MONTH SECTIONS ── */
    .month-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .month-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .month-header {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);

      border-bottom: 1px solid var(--light-gray);
    }

    /* ── BOOK GRID ── */

      display: grid;

    .book-card {

<script>
const WORKBOOK_FILE = 'New_Arrivals_2026_All_Months.xlsx';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_INDEX = Object.fromEntries(MONTHS.map((m,i)=>[m.toLowerCase(), i+1]));

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function safeUrl(value) {
  const s = String(value ?? '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}
function normalizeRow(row) {
  const out = {};
  Object.entries(row).forEach(([k,v]) => {
    const key = String(k).trim().toLowerCase().replace(/\s+/g,' ');
    out[key] = v;
  });
  return {
    title: out['title'] ?? '',
    author: out['author'] ?? '',
    opac: out['opac link'] ?? '',
    image: out['book image link'] ?? ''
  };
}

function parseWorkbook(workbook) {
  const grouped = {hyderabad: {}, mohali: {}};
  const re = /^(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})-(HYD|Mohali)$/i;

  workbook.SheetNames.forEach(sheetName => {
    const match = sheetName.trim().match(re);
    if (!match) return;
    const month = match[1][0].toUpperCase() + match[1].slice(1).toLowerCase();
    const year = Number(match[2]);
    const campus = match[3].toLowerCase() === 'hyd' ? 'hyderabad' : 'mohali';
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {defval:''})
      .map(normalizeRow)
      .filter(r => String(r.title).trim() !== '');
    if (!rows.length) return;
    const key = `${year}-${String(MONTH_INDEX[month.toLowerCase()]).padStart(2,'0')}`;
    grouped[campus][key] = {month, year, books: rows};
  });
  return grouped;
}

function bookCard(book) {
  const title = esc(book.title);
  const author = esc(book.author);
  const img = safeUrl(book.image);
  const opac = safeUrl(book.opac);
  const cover = img
    ? `<img alt="${title}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" src="${esc(img)}"/><div aria-hidden="true" class="book-cover-placeholder" style="display:none">📘</div>`
    : `<div aria-hidden="true" class="book-cover-placeholder" style="display:flex">📘</div>`;
  const opacButton = opac
    ? `<div class="book-links"><a class="book-link book-opac-link" href="${esc(opac)}" rel="noopener noreferrer" target="_blank">OPAC</a></div>`
    : '';
  return `<div class="book-card"><div class="book-cover">${cover}</div><div class="book-info"><h4 class="book-title">${title}</h4><p class="book-author">${author}</p>${opacButton}</div></div>`;
}

function renderCampus(campus, data) {
  const tabs = document.getElementById(`tabs-${campus}`);
  const monthsBox = document.getElementById(`months-${campus}`);
  tabs.innerHTML = '';
  monthsBox.innerHTML = '';

  const entries = Object.entries(data).sort((a,b) => b[0].localeCompare(a[0]));
  if (!entries.length) {
    tabs.innerHTML = '<li><span class="tab-button active" style="cursor:default">No data</span></li>';
    monthsBox.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📚</div><p>No new-arrival records are available for this campus yet.</p></div>';
    return;
  }

  entries.forEach(([key, block], idx) => {
    const isLatest = idx === 0;
    const id = `campus-${campus}-${block.month.toLowerCase()}-${block.year}`;
    const li = document.createElement('li');
    li.innerHTML = `<button class="tab-button${isLatest ? ' active' : ''}" data-tab="${id}" type="button">${esc(block.month)} ${block.year}</button>`;
    tabs.appendChild(li);

    const section = document.createElement('section');
    section.className = `month-section${isLatest ? ' active' : ''}`;
    section.id = id;
    section.innerHTML = `<h3 class="month-header">${esc(block.month)} ${block.year}</h3><div class="books-grid">${block.books.map(bookCard).join('')}</div>`;
    monthsBox.appendChild(section);
  });

  // Month-tab clicks are handled by the delegated listener below.
  // This works for both the catalogue already embedded in this HTML file
  // and any tabs created later after loading a new Excel workbook.
}

function renderWorkbook(workbook) {
  const grouped = parseWorkbook(workbook);
  renderCampus('hyderabad', grouped.hyderabad);
  renderCampus('mohali', grouped.mohali);
  document.getElementById('data-source-bar').classList.add('ready');
}

async function loadArrayBuffer(buffer) {
  const workbook = XLSX.read(buffer, {type:'array'});
  renderWorkbook(workbook);
}

async function autoLoad() {
  // This one-file edition already contains the current rendered catalogue.
  // The optional Excel picker remains available if you want to refresh the page from a workbook.
  const bar = document.getElementById('data-source-bar');
  if (bar) bar.classList.add('ready');
}

document.getElementById('excel-file').addEventListener('change', async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  document.getElementById('load-status').textContent = `Loading ${file.name}…`;
  await loadArrayBuffer(await file.arrayBuffer());
});

// Handle month tabs for the catalogue already embedded in this one-file page,
// as well as tabs created dynamically from an Excel workbook.
document.addEventListener('click', event => {
  const button = event.target.closest('.tab-button[data-tab]');
  if (!button) return;

  const campusSection = button.closest('.campus-section');
  if (!campusSection) return;

  const targetId = button.dataset.tab;
  const target = document.getElementById(targetId);
  if (!target || !campusSection.contains(target)) return;

  campusSection.querySelectorAll('.tab-button[data-tab]').forEach(btn => btn.classList.remove('active'));
  campusSection.querySelectorAll('.month-section').forEach(section => section.classList.remove('active'));

  button.classList.add('active');
  target.classList.add('active');

  // Keep the selected month tab visible when the tab row is wider than the screen.
  button.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
});

// Allow a mouse wheel/trackpad to move a long month-tab row horizontally.
document.querySelectorAll('.tab-container').forEach(tabContainer => {
  tabContainer.addEventListener('wheel', event => {
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX) && tabContainer.scrollWidth > tabContainer.clientWidth) {
      tabContainer.scrollLeft += event.deltaY;
      event.preventDefault();
    }
  }, {passive: false});
});

document.querySelectorAll('.campus-button').forEach(button => {
  button.addEventListener('click', () => {
    const campusId = button.dataset.campus;
    document.querySelectorAll('.campus-button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.campus-section').forEach(section => section.classList.remove('active'));
    button.classList.add('active');
    document.getElementById(`campus-${campusId}`).classList.add('active');
  });
});

autoLoad();
</script>


</body></html>
