
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LRC New Arrivals — ISB</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;family=Source+Sans+3:wght@300;400;500;600;700&amp;display=swap[...]
<style>
    :root {
      --innovation-blue: #245bff;
      --legacy-blue:     #192890;
      --future-green:    #80edd9;
      --state-gray:      #2e3b42;
      --mattle-gray:     #5d6f7a;
      --silver-gray:     #95a9b4;
      --light-gray:      #e6ebee;
      --ivory:           #f4f8fa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ivory);
      color: var(--state-gray);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER — compact ~44px ── */
    header {
      background: var(--legacy-blue);
      height: 44px;
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 6px rgba(25,40,144,0.28);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .site-title {
      color: #fff;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .isb-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    /* ── TAB NAVIGATION ── */
    .tab-container {
      background: #fff;
      border-bottom: 2px solid var(--light-gray);
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-list {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: min-content;
    }

    .tab-list li {
      display: inline-block;
    }

    .tab-button {
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      color: var(--mattle-gray);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-family: 'Source Sans 3', sans-serif;
    }

    .tab-button:hover {
      color: var(--innovation-blue);
    }

    .tab-button.active {
      color: var(--innovation-blue);
      border-bottom-color: var(--innovation-blue);
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      padding: clamp(1.5rem, 4vw, 3rem);
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      margin-bottom: 2.5rem;
      border-bottom: 2px solid var(--light-gray);
      padding-bottom: 1.5rem;
    }

    .page-title {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--legacy-blue);
      margin-bottom: 0.5rem;
    }

    .page-subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: var(--mattle-gray);
      font-weight: 400;
    }

    /* ── MONTH SECTIONS ── */
    .month-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .month-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .month-header {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      color: var(--innovation-blue);
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--light-gray);
    }

    /* ── BOOK GRID ── */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: clamp(1.5rem, 3vw, 2.5rem);
      margin-bottom: 2rem;
    }

    .book-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(46, 59, 66, 0.12);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border: 1px solid var(--light-gray);
      padding: 1.25rem 1rem;
    }

    .book-card:hover {
      box-shadow: 0 6px 20px rgba(36, 91, 255, 0.15);
      transform: translateY(-4px);
      border-color: var(--innovation-blue);
    }

    .book-cover {
      width: 8cm;
      height: 8cm;
      background: linear-gradient(135deg, var(--light-gray) 0%, var(--silver-gray) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #fff;
      padding: 0.35rem;
    }

    .book-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--silver-gray);
    }

    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .book-title {
      font-family: 'Source Serif 4', serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--state-gray);
      margin-bottom: 0.5rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 0.8rem;
      color: var(--mattle-gray);
      margin-bottom: 0.75rem;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-links {
      margin-top: auto;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .book-link {
      display: inline-block;
      padding: 0.4rem 0.7rem;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      transition: background 0.3s ease;
      text-align: center;
      flex: 1;
      min-width: 75px;
    }

    .book-opac-link {
      background: var(--innovation-blue);
    }

    .book-opac-link:hover {
      background: var(--legacy-blue);
    }
.empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--mattle-gray);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--legacy-blue);
      color: #fff;
      padding: clamp(1.5rem, 3vw, 2.5rem);
      text-align: center;
      margin-top: auto;
      font-size: 0.9rem;
    }

    footer a {
      color: var(--future-green);
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .books-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.5rem;
      }

      .page-title {
        margin-bottom: 0.75rem;
      }

      .tab-button {
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 0 1rem;
      }

      .header-left {
        gap: 0.5rem;
      }

      .site-title {
        font-size: 1rem;
      }

      .isb-logo {
        height: 32px;
      }

      main {
        padding: 1rem;
      }

      .books-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }

      .book-card {
        padding: 0.75rem;
      }

      .book-cover {
        width: 6cm;
        height: 6cm;
        margin-bottom: 0.75rem;
      }

      .tab-container {
        padding: 0;
      }

      .tab-button {
        padding: 0.6rem 0.9rem;
        font-size: 0.8rem;
      }

      .book-links {
        flex-direction: column;
      }

      .book-link {
        min-width: auto;
      }
    }
  

    /* ── CAMPUS NAVIGATION ── */
    .campus-container {
      background: var(--legacy-blue);
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      border-top: 1px solid rgba(255,255,255,0.16);
    }
    .campus-list {
      display: flex;
      gap: 0.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .campus-button {
      padding: 0.72rem 1.15rem;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font: 600 0.92rem 'Source Sans 3', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .campus-button:hover,
    .campus-button.active {
      color: #fff;
      border-bottom-color: var(--future-green);
    }
    .campus-section { display: none; }
    .campus-section.active { display: block; }
</style>
</head>
<body>
<!-- ── HEADER ── -->
<header>
<div class="header-left">
<h1 class="site-title">LRC New Arrivals</h1>
</div>
<div class="header-right">
<img alt="ISB Logo" class="isb-logo" src="https://www.isb.edu/_next/image?url=https%3A%2F%2Fprodcd.isb.edu%2Fmedia%2Fz5tgmw5k%2Fisb-logo1.jpg%3Fwidth%3D1920%26format%3Dwebp%26quality%3D100&amp;w=[...]
</div>
</header><nav aria-label="Campus selection" class="campus-container"><ul class="campus-list"><li><button class="campus-button active" data-campus="hyderabad" type="button">Hyderabad</button></li>[...]
<!-- ── TAB NAVIGATION ── -->
<!-- ── MAIN CONTENT ── -->
<!-- ── FOOTER ── -->
<footer>
<p>© 2026 LRC ISB. All rights reserved. | <a href="https://www.isb.edu/learning-resource-centre">About LRC</a> | <a href="https://www.isb.edu/learning-resource-centre#contact">Contact Us</a></p>
</footer>
<script>
    // Campus switching functionality
    const campusButtons = document.querySelectorAll('.campus-button');
    const campusSections = document.querySelectorAll('.campus-section');

    campusButtons.forEach(button => {
      button.addEventListener('click', () => {
        const campusId = button.getAttribute('data-campus');
        campusButtons.forEach(btn => btn.classList.remove('active'));
        campusSections.forEach(section => section.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(`campus-${campusId}`).classList.add('active');
      });
    });

    // Independent month switching for each campus
    document.querySelectorAll('.campus-section').forEach(campus => {
      const tabButtons = campus.querySelectorAll('.tab-button');
      const monthSections = campus.querySelectorAll('.month-section');

      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          const tabId = button.getAttribute('data-tab');
          tabButtons.forEach(btn => btn.classList.remove('active'));
          monthSections.forEach(section => section.classList.remove('active'));
          button.classList.add('active');
          const target = campus.querySelector(`#${tabId}`);
          if (target) target.classList.add('active');
        });
      });
    });
</script>
</body>
</html>
